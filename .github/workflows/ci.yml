name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, migrate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ajaia
          POSTGRES_PASSWORD: ajaia
          POSTGRES_DB: ajaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajaia -d ajaia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ajaia:ajaia@localhost:5432/ajaia_test?schema=public
      TEST_DATABASE_URL: postgresql://ajaia:ajaia@localhost:5432/ajaia_test?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Compose needs the .env variables to interpolate; the example file is enough for a build.
      - run: docker compose --env-file .env.production.example build
      - run: docker compose --env-file .env.production.example config --quiet
